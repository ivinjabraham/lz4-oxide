[package]
name = "lz4_rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Ivin Joel Abraham", "Hridesh M. G.", "Abhinav M."]
license = "BSD-2-Clause"
description = "Rust port of the LZ4 compression library, ABI-compatible with liblz4"

# staticlib => target/<profile>/liblz4_rs.a, which the original C test suite
# links in place of the C objects. cdylib is here for the shared-library and
# CLI test paths.
[lib]
name = "lz4_rs"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "port"
path = "tests/port/safe_helpers.rs"

[dependencies]
# None. xxHash is implemented in-tree (src/xxh.rs) rather than taken from a
# crate: XXH32_state_t/XXH64_state_t are declared on the C test's stack, so
# their layout is fixed by the C header and no crate's private state type can
# match it. See DECISIONS.md §6.

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# The C test harness has no Rust unwinder; abort keeps the ABI boundary simple
# and makes an unimplemented!() stub fail loudly instead of unwinding into C.
panic = "abort"

[profile.dev]
panic = "abort"
